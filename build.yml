name: Build Firmware

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set target
        run: idf.py set-target esp32s3

      - name: Build
        run: idf.py build

      - name: Collect bins
        run: |
          mkdir -p out
          cp build/bootloader/bootloader.bin out/ 2>/dev/null || true
          cp build/partition_table/partition-table.bin out/ 2>/dev/null || true
          cp build/ota_data_initial.bin out/ 2>/dev/null || true
          cp build/mitya_ble.bin out/firmware.bin 2>/dev/null || true
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mitya_ble_firmware
          path: out/*
          retention-days: 30
